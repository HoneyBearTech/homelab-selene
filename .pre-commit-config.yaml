exclude: ^\.agent/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '(?i)(\.md$|(^|/)README[^/]*$|^docs/|^\.github/workflows/|(^|/)CODEOWNERS$)'
      - id: end-of-file-fixer
        exclude: '(?i)(\.md$|(^|/)README[^/]*$|^docs/|^\.github/workflows/|(^|/)CODEOWNERS$)'
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-added-large-files
        args: [--enforce-all]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        language_version: 1.24.11
        entry: >-
          bash -c 'status=0; for file do
          gitleaks dir --redact --no-banner --no-color "$file" || status=$?;
          done; exit "$status"' --
        pass_filenames: true
        require_serial: true

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: [--strict, -c, .yamllint.yml]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [-x]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
      - id: ruff-format
        args: [--check]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
